<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Governor</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 2rem; }
        .row { margin: 0.75rem 0; font-size: 1.2rem; }
        .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 0.5rem; }
        .on { background: #3c3; }
        .off { background: #c33; }
        .talking { background: #39f; box-shadow: 0 0 10px #39f; }
        .idle { background: #444; }
    </style>
</head>
<body>
    <h1>Governor</h1>

    <div class="row"><span id="running-dot" class="dot off"></span>Game running: <span id="running-text">no</span></div>
    <div class="row"><span id="started-dot" class="dot off"></span>Match started: <span id="started-text">no</span></div>
    <div class="row"><span id="talking-dot" class="dot idle"></span>Speaking: <span id="talking-text">no</span> (hold left shift)</div>

    <script>
        // Set one indicator: its dot's colour class and its yes/no text.
        function setIndicator(name, isOn, onClass, offClass, text) {
            document.getElementById(name + "-dot").className = "dot " + (isOn ? onClass : offClass);
            document.getElementById(name + "-text").textContent = text ?? (isOn ? "yes" : "no");
        }

        // fetch() asks Flask for JSON in the background; await waits for the answer.
        async function updateStatus() {
            try {
                const status = await (await fetch("/api/status")).json();
                setIndicator("running", status.game_running, "on", "off");
                const time = status.game_started ? `yes (${Math.floor(status.game_time)} s)` : "no";
                setIndicator("started", status.game_started, "on", "off", time);
            } catch (error) {
                // Flask isn't reachable (e.g. it's restarting); try again next time.
            }
        }

        async function updateTalking() {
            try {
                const data = await (await fetch("/api/talking")).json();
                setIndicator("talking", data.talking, "talking", "idle");
            } catch (error) {}
        }

        updateStatus();
        setInterval(updateStatus, 2000);   // every 2 seconds
        setInterval(updateTalking, 100);   // 10 times a second, so it feels instant
    </script>
</body>
</html>
